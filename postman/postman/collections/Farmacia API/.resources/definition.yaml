$kind: collection
description: 1) Ejecuta Auth > Login (guarda el token solo). 2) Usa las demás peticiones. Ajusta los IDs en la pestaña Variables de la colección.
variables:
  base_url: http://localhost:8000/api
  token: ""
  nombre_usuario: admin
  password: password
  medico_id: "1"
  paciente_id: "1"
  producto_id: "1"
  cita_id: "1"
  expediente_id: "1"
  receta_id: "1"
  detalle_id: "1"
auth:
  - id: 7f51568d-7e97-44b7-8884-4bbfafb2271b
    type: bearer
    name: bearer auth
    credentials:
      token: "{{token}}"
