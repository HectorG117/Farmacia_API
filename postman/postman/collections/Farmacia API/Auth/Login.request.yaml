$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre_usuario": "admin",
      "password": "admin",
      "dispositivo": "Postman"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        pm.collectionVariables.set('token', pm.response.json().token);
      }
    language: text/javascript
