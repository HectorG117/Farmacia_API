$kind: http-request
url: "{{base_url}}/expedientes"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_cita": "{{cita_id}}",
      "fecha": "2026-10-24 10:00:00",
      "diagnostico": "Migraña tensional",
      "tratamiento": "Paracetamol 500 mg cada 8 horas por 5 días",
      "observaciones": "Revisión en 2 semanas"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('expediente_id', pm.response.json().data.id_expediente);
      }
    language: text/javascript
order: 3000
