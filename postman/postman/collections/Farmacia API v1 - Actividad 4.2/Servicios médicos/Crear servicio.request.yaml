$kind: http-request
url: "{{base_url}}/servicios-medicos"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Toma de presión arterial",
      "descripcion": "Medición con baumanómetro digital.",
      "costo": 35,
      "activo": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      pm.test("Formato estándar", () => { const j = pm.response.json(); pm.expect(j).to.have.all.keys("success","message","data","errors"); });
      if (pm.response.code === 201) pm.collectionVariables.set("servicio_id", pm.response.json().data.id);
    language: text/javascript
order: 3000
