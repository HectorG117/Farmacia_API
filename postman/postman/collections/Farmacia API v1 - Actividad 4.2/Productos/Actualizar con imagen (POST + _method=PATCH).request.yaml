$kind: http-request
description: PHP no lee archivos en PUT/PATCH reales; por eso se envía POST con _method.
url: "{{base_url}}/productos/{{producto_id}}"
method: POST
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: text
      key: _method
      value: PATCH
    - type: text
      key: stock
      value: "55"
    - type: file
      key: imagen
      src: []
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Formato estándar", () => { const j = pm.response.json(); pm.expect(j).to.have.all.keys("success","message","data","errors"); });
    language: text/javascript
order: 8000
