$kind: http-request
description: Si ya tenía imagen, el archivo anterior se borra (si ningún otro producto lo usa).
url: "{{base_url}}/productos/{{producto_id}}/imagen"
method: POST
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: file
      key: imagen
      src: []
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Formato estándar", () => { const j = pm.response.json(); pm.expect(j).to.have.all.keys("success","message","data","errors"); });
    language: text/javascript
order: 9000
