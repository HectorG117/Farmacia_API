$kind: http-request
url: "{{base_url}}/productos/{{producto_id}}"
method: PUT
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Ibuprofeno 600 mg",
      "precio": 75,
      "stock": 60,
      "categoria": "Medicamentos"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Formato estándar", () => { const j = pm.response.json(); pm.expect(j).to.have.all.keys("success","message","data","errors"); });
    language: text/javascript
order: 6000
