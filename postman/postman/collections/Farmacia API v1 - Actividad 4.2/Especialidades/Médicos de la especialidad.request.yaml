$kind: http-request
url: "{{base_url}}/especialidades/{{especialidad_id}}/medicos"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Formato estándar", () => { const j = pm.response.json(); pm.expect(j).to.have.all.keys("success","message","data","errors"); });
    language: text/javascript
order: 4000
