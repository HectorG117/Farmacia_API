$kind: http-request
url: "{{base_url}}/recetas/{{receta_id}}/detalles/{{detalle_id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "producto_id": "{{producto_id}}",
      "cantidad": 3,
      "dosis": "1 tableta de 500 mg",
      "frecuencia": "Cada 8 horas",
      "duracion": "Durante 5 días",
      "instrucciones": "Tomar después de los alimentos"
    }
order: 4000
